<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Aniversário 🌸</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aniversário">
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=180&h=180&fit=crop">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .safari-padding {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased safari-padding">

    <header class="bg-white border-b border-slate-100 sticky top-0 z-50 px-4 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-pink-100 rounded-full flex items-center justify-center text-pink-500 text-xl font-bold shadow-inner">
                🌸
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">Meu Aniversário</h1>
                <p class="text-xs text-slate-400">Painel de Controle</p>
            </div>
        </div>
        <button onclick="printGuestList()" class="bg-slate-900 text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 active:scale-95 transition-all shadow-sm">
            <i class="fa-solid fa-file-export"></i> Portaria
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6 pb-24">

        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-pink-400"></i> Informações do Evento
            </h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-slate-500">Data</label>
                    <input type="date" id="evt-date" class="border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-slate-500">Horário</label>
                    <input type="time" id="evt-time" class="border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-medium text-slate-500">Local</label>
                <input type="text" id="evt-local" placeholder="Ex: Salão de Festas" class="border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-pink-400">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-medium text-slate-500">Endereço</label>
                <input type="text" id="evt-addr" placeholder="Rua, número e bairro" class="border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-pink-400">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-slate-500">Tema / Dress Code</label>
                    <input type="text" id="evt-theme" placeholder="Ex: Esporte Fino" class="border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-slate-500">Observações</label>
                    <input type="text" id="evt-obs" placeholder="Ex: Trazer biquíni" class="border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
            </div>

            <button onclick="saveInfo()" class="w-full bg-pink-500 text-white font-medium py-3 rounded-xl text-sm active:scale-98 transition-all shadow-md shadow-pink-100">
                Salvar Alterações
            </button>
        </section>

        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <i class="fa-solid fa-user-plus text-blue-400"></i> Novo Convidado
            </h2>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-medium text-slate-500">Nome Completo</label>
                <input type="text" id="g-name" placeholder="Nome do convidado" class="border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-medium text-slate-500">Contato</label>
                <input type="text" id="g-contact" placeholder="Telefone ou @do Instagram" class="border border-slate-200 rounded-xl p-2.5 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <button onclick="addGuest()" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl text-sm active:scale-98 transition-all shadow-md shadow-blue-100">
                Adicionar à Lista
            </button>
        </section>

        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-users text-emerald-400"></i> Lista de Presença
                </h2>
                <span id="counter-confirmed" class="text-xs font-bold bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full border border-emerald-100">
                    0 Confirmados
                </span>
            </div>

            <div id="guest-list-container" class="divide-y divide-slate-100 max-h-80 overflow-y-auto pr-1 space-y-2">
                <p class="text-center text-slate-400 text-sm py-4">Nenhum convidado adicionado ainda.</p>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Substitua com as credenciais do seu projeto Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyCVZOMJkXzJcn86DVlHbZRahwplbYa5SW4",
          authDomain: "aline23.firebaseapp.com",
          projectId: "aline23",
          storageBucket: "aline23.firebasestorage.app",
          messagingSenderId: "379014007400",
          appId: "1:379014007400:web:ed54b2016bd5b1496c89dd",
          measurementId: "G-ZN7F396CY9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Objeto global de estado
        window.data = {
            guests: [],
            info: {}
        };

        // Carregar Informações do Evento
        window.loadInfo = function() {
            const infoRef = ref(db, 'evento/info');
            onValue(infoRef, (snapshot) => {
                const info = snapshot.val() || {};
                window.data.info = info;
                
                if(info.date) document.getElementById('evt-date').value = info.date;
                if(info.time) document.getElementById('evt-time').value = info.time;
                if(info.local) document.getElementById('evt-local').value = info.local;
                if(info.addr) document.getElementById('evt-addr').value = info.addr;
                if(info.theme) document.getElementById('evt-theme').value = info.theme;
                if(info.obs) document.getElementById('evt-obs').value = info.obs;
            });
        };

        // Salvar Informações do Evento
        window.saveInfo = function() {
            const infoRef = ref(db, 'evento/info');
            const infoData = {
                date: document.getElementById('evt-date').value,
                time: document.getElementById('evt-time').value,
                local: document.getElementById('evt-local').value,
                addr: document.getElementById('evt-addr').value,
                theme: document.getElementById('evt-theme').value,
                obs: document.getElementById('evt-obs').value
            };

            set(infoRef, infoData)
                .then(() => alert('Informações do evento salvas com sucesso! 🌸'))
                .catch((error) => console.error("Erro ao salvar informações:", error));
        };

        // Adicionar Convidado
        window.addGuest = function() {
            const nameField = document.getElementById('g-name');
            const contactField = document.getElementById('g-contact');

            const name = nameField.value.trim();
            const contact = contactField.value.trim();

            if (!name) {
                alert('Por favor, digite o nome do convidado.');
                return;
            }

            const guestsRef = ref(db, 'evento/convidados');
            const newGuestRef = push(guestsRef);

            set(newGuestRef, {
                name: name,
                contact: contact || 'Não informado',
                status: 'pending' // pending, confirmed, declined
            }).then(() => {
                nameField.value = '';
                contactField.value = '';
            }).catch((error) => console.error("Erro ao adicionar convidado:", error));
        };

        // Alternar Status de Confirmação
        window.toggleStatus = function(id, currentStatus) {
            const nextStatus = currentStatus === 'confirmed' ? 'pending' : 'confirmed';
            const guestRef = ref(db, `evento/convidados/${id}`);
            update(guestRef, { status: nextStatus });
        };

        // Remover Convidado
        window.deleteGuest = function(id) {
            if(confirm("Deseja realmente remover este convidado da lista?")) {
                const guestRef = ref(db, `evento/convidados/${id}`);
                remove(guestRef);
            }
        };

        // Escutar alterações na lista de convidados
        const guestsRef = ref(db, 'evento/convidados');
        onValue(guestsRef, (snapshot) => {
            const guestsContainer = document.getElementById('guest-list-container');
            guestsContainer.innerHTML = '';
            
            const listData = snapshot.val();
            window.data.guests = [];

            if (!listData) {
                guestsContainer.innerHTML = `<p class="text-center text-slate-400 text-sm py-4">Nenhum convidado na lista.</p>`;
                document.getElementById('counter-confirmed').innerText = '0 Confirmados';
                return;
            }

            let confirmedCount = 0;

            Object.keys(listData).forEach((key) => {
                const guest = listData[key];
                guest.id = key;
                window.data.guests.push(guest);

                if(guest.status === 'confirmed') confirmedCount++;

                const isConfirmed = guest.status === 'confirmed';

                const itemHtml = `
                    <div class="flex items-center justify-between py-3 border-b border-slate-50 last:border-0">
                        <div class="flex flex-col max-w-[65%]">
                            <span class="font-semibold text-sm truncate ${isConfirmed ? 'text-slate-800' : 'text-slate-500'}">${guest.name}</span>
                            <span class="text-xs text-slate-400 truncate"><i class="fa-solid fa-address-book text-[10px]"></i> ${guest.contact}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleStatus('${key}', '${guest.status}')" class="p-2 rounded-xl border transition-all text-xs flex items-center justify-center ${isConfirmed ? 'bg-emerald-50 border-emerald-200 text-emerald-600' : 'bg-slate-50 border-slate-200 text-slate-400'}">
                                <i class="fa-solid ${isConfirmed ? 'fa-check-double' : 'fa-check'}"></i>
                            </button>
                            <button onclick="deleteGuest('${key}')" class="p-2 rounded-xl bg-red-50 border border-red-100 text-red-500 text-xs flex items-center justify-center active:scale-90 transition-all">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                guestsContainer.insertAdjacentHTML('beforeend', itemHtml);
            });

            document.getElementById('counter-confirmed').innerText = `${confirmedCount} Confirmados`;
        });

        // Função de exportação para a Portaria
        window.printGuestList = function() {
            if (!window.data.guests || window.data.guests.length === 0) {
                alert('Não há convidados cadastrados na lista.');
                return;
            }

            const confirmedList = window.data.guests
                .filter(g => g.status === 'confirmed')
                .map((g, index) => `${index + 1}. ${g.name} (${g.contact})`)
                .join('\n');

            if (!confirmedList) {
                alert('Nenhum convidado confirmou presença ainda.');
                return;
            }

            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Lista da Portaria - Confirmados</title>
                    <style>
                        body { font-family: sans-serif; padding: 30px; color: #333; }
                        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
                        pre { font-family: sans-serif; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
                        .footer { margin-top: 40px; font-size: 12px; color: #777; border-top: 1px solid #ddd; padding-top: 10px; }
                    </style>
                </head>
                <body>
                    <h2>📋 Lista de Convidados Confirmados</h2>
                    <pre>${confirmedList}</pre>
                    <div class="footer">Gerado automaticamente em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}</div>
                </body>
                </html>
            `);
            win.document.close();
            win.print();
        };

        // Inicialização automática
        loadInfo();
    </script>
</body>
</html>
